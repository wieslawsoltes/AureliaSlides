name: Import Aurelia Slides source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-aurelia-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify and restore the complete source package
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          import { dirname } from 'node:path';
          const parts = await Promise.all(Array.from({ length: 7 }, (_, i) => readFile(`.bootstrap/source-${String(i + 1).padStart(2, '0')}.br`)));
          const archive = Buffer.concat(parts);
          const hash = createHash('sha256').update(archive).digest('hex');
          if (hash !== '191390668d3a7243cea3f0b5eed45892fa870f65d39732634a79ee82d0fcdccd') throw new Error('Source package checksum mismatch');
          const files = JSON.parse(brotliDecompressSync(archive).toString('utf8'));
          const allowed = new Set(['.gitignore', '.nojekyll', 'README.md', 'dev.html', 'index.html', 'package.json', 'scripts/build.mjs', 'src/app.js', 'src/core.js', 'src/demo.js', 'src/icons.js', 'src/pptx.js', 'src/renderer.js', 'tests/core.test.mjs']);
          if (Object.keys(files).length !== allowed.size) throw new Error('Unexpected file count');
          for (const [path, content] of Object.entries(files)) {
            if (!allowed.has(path) || typeof content !== 'string') throw new Error(`Unexpected source path: ${path}`);
            await mkdir(dirname(path), { recursive: true });
            await writeFile(path, content, 'utf8');
            console.log(`Restored ${path}`);
          }
          NODE
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run kernel tests
        run: npm test
      - name: Rebuild standalone application
        run: npm run build
      - name: Commit readable source and remove transfer package
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .nojekyll README.md dev.html index.html package.json scripts src tests
          git add -u .bootstrap
          git commit -m 'Add Aurelia Slides editor, WebGPU engine, tests, and reproducible build'
          git push origin HEAD:main
